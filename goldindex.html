<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gold Scorecard</title>
<style>
:root{--bg:#1c1d22;--panel:#26272e;--text:#e8e8ee;--mute:#8d8fa0;--bull:#3b49d8;--bear:#ef5a5a;--neu:#555866}
*{box-sizing:border-box}
body{margin:0;padding:env(safe-area-inset-top,0) 10px env(safe-area-inset-bottom,0);background:var(--bg);color:var(--text);font:15px/1.4 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 4px}
header b{font-size:18px}small,.mute{color:var(--mute);font-size:12px}
.big{text-align:center;padding:10px;border-radius:6px;font-weight:600;font-size:18px}
.gauge{display:block;margin:6px auto;width:240px}
.scores{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}
.scores div{display:flex;justify-content:space-between;background:var(--panel);padding:8px 10px;border-radius:6px}
.sec{background:var(--panel);border-radius:6px;margin:10px 0;overflow:hidden}
.sec h3{margin:0;padding:8px 10px;font-size:14px;display:flex;justify-content:space-between;background:#32333b}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:8px 10px;border-top:1px solid #33343c}
.row .nums{grid-column:1/3;display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.tag{padding:2px 10px;border-radius:4px;font-size:12px;font-weight:600;align-self:center}
.Bullish,.Very.Bullish{background:var(--bull)}.Bearish,.Very.Bearish{background:var(--bear)}.Neutral{background:var(--neu)}
.t-Bullish{color:#7d8bff}.t-Bearish{color:var(--bear)}.t-Neutral{color:var(--mute)}
.bar{height:14px;border-radius:7px;overflow:hidden;display:flex;margin:8px 10px}
#err{color:var(--bear);padding:12px}
</style></head><body>
<header><b id="sym">Gold</b><small id="upd"></small></header>
<div id="app">Loading…</div>
<script>
const fmt=n=>Math.abs(n)>=1000?(n/1000).toFixed(0)+"k":n;
const tag=l=>`<span class="tag ${l.replace(" ","\u00a0")==l?l:l.split(" ").join(" ")}">${l}</span>`;
async function load(){
  try{
    const r=await fetch("data.json?"+Date.now());const d=await r.json();
    document.getElementById("sym").textContent="Symbol: "+d.symbol;
    document.getElementById("upd").textContent="Updated "+new Date(d.updated).toLocaleString();
    const s=d.scores,ang=Math.max(-90,Math.min(90,s.total*6));
    const rad=(ang-90)*Math.PI/180,nx=120+80*Math.cos(rad),ny=120+80*Math.sin(rad);
    let h=`<div class="big tag ${d.overall.split(" ").pop()}">${d.overall}</div>
    <svg class="gauge" viewBox="0 0 240 130"><path d="M20 120A100 100 0 0 1 220 120" fill="none" stroke="#33343c" stroke-width="22"/>
    <path d="M20 120A100 100 0 0 1 70 33" fill="none" stroke="#ef5a5a" stroke-width="22"/>
    <path d="M170 33A100 100 0 0 1 220 120" fill="none" stroke="#3b49d8" stroke-width="22"/>
    <line x1="120" y1="120" x2="${nx}" y2="${ny}" stroke="#fff" stroke-width="3"/><circle cx="120" cy="120" r="6" fill="#fff"/></svg>
    <div class="scores"><div>Total<b>${s.total}</b></div><div>Macro<b>${s.macro}</b></div><div>Technical<b>${s.technical}</b></div><div>Sentiment<b>${s.sentiment}</b></div></div>`;
    const c=d.cot;
    h+=`<div class="sec"><h3>COT positioning <span class="mute">${c.date}</span></h3>
      <div class="bar"><div style="width:${c.long}%;background:var(--bull)"></div><div style="width:${c.short}%;background:var(--bear)"></div></div>
      <div class="row"><span>Long ${c.long}% · Short ${c.short}%</span><span class="tag ${c.long>50?"Bullish":"Bearish"}">${c.long>50?"Bullish":"Bearish"}</span>
      <div class="nums"><span>Weekly change</span><span>${c.change}%</span></div></div></div>`;
    d.sections.forEach(sec=>{
      h+=`<div class="sec"><h3>${sec.title}<span class="tag ${sec.label.split(" ").pop()}">${sec.label}</span></h3>`;
      sec.rows.forEach(r=>{h+=`<div class="row"><span>${r.name}</span><span class="tag ${r.signal}">${r.signal}</span>
        <div class="nums"><span>Actual ${fmt(r.actual)}</span><span>Fcst ${fmt(r.forecast)}</span><span class="t-${r.signal}">${r.surprise>0?"+":""}${fmt(r.surprise)}</span><span>${r.date}</span></div></div>`});
      h+="</div>"});
    h+=`<div class="sec"><div class="row"><span>2Y yield vs 21-day avg</span><span class="tag ${d.yield2y.signal}">${d.yield2y.signal}</span>
      <div class="nums"><span>${d.yield2y.latest}% now</span><span>${d.yield2y.sma21}% avg</span></div></div></div>
    <p class="mute" style="text-align:center">Informational only. Not financial advice.</p>`;
    document.getElementById("app").innerHTML=h;
  }catch(e){document.getElementById("app").innerHTML='<div id="err">Could not load data.json. Check that it is hosted next to this page.</div>'}
}
load();
</script></body></html>
